<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Unit economics comparison of static CDN edge delivery versus dynamic SSR server infrastructure">
  <rect width="1280" height="720" fill="#F1F2EF"/>
  <rect x="48" y="48" width="1184" height="624" rx="12" fill="#FAFAF8" stroke="#DCE1DC" stroke-width="2"/>
  <text x="96" y="114" font-family="monospace" font-size="16" fill="#315F4E" letter-spacing="2">FIG 03 · INFRASTRUCTURE COST &amp; LATENCY AT 10,000+ ARTICLES</text>
  <line x1="96" y1="150" x2="1184" y2="150" stroke="#DCE1DC" stroke-width="1.5"/>
  <rect x="96" y="200" width="520" height="410" rx="8" fill="#FFFFFF" stroke="#315F4E" stroke-width="2"/>
  <text x="136" y="256" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#315F4E">Static SSG + Edge CDN</text>
  <text x="136" y="316" font-family="monospace" font-size="20" fill="#1B201D">TTFB (p95): 18–35 ms</text>
  <text x="136" y="366" font-family="monospace" font-size="20" fill="#1B201D">Runtime DB Cost: $0 / mo</text>
  <text x="136" y="416" font-family="monospace" font-size="20" fill="#1B201D">Search Index: Static Pagefind</text>
  <text x="136" y="466" font-family="monospace" font-size="20" fill="#1B201D">Failure Surface: Build-time Gate</text>

  <rect x="664" y="200" width="520" height="410" rx="8" fill="#FFFFFF" stroke="#DCE1DC" stroke-width="2"/>
  <text x="704" y="256" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#5D6860">Dynamic CMS + Runtime SSR</text>
  <text x="704" y="316" font-family="monospace" font-size="20" fill="#5D6860">TTFB (p95): 240–680 ms</text>
  <text x="704" y="366" font-family="monospace" font-size="20" fill="#5D6860">Runtime DB + Cache: Variable</text>
  <text x="704" y="416" font-family="monospace" font-size="20" fill="#5D6860">Search Index: Hosted SaaS API</text>
  <text x="704" y="466" font-family="monospace" font-size="20" fill="#5D6860">Failure Surface: 24/7 Origin</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Architecture diagram showing static Astro build pipeline, reciprocal hreflang graph, and Pagefind indexing">
  <rect width="1280" height="720" fill="#F1F2EF"/>
  <rect x="48" y="48" width="1184" height="624" rx="12" fill="#FAFAF8" stroke="#DCE1DC" stroke-width="2"/>
  <g stroke="#DCE1DC" stroke-width="1">
    <line x1="48" y1="160" x2="1232" y2="160"/>
    <line x1="440" y1="160" x2="440" y2="672"/>
    <line x1="840" y1="160" x2="840" y2="672"/>
  </g>
  <text x="96" y="114" font-family="monospace" font-size="16" fill="#315F4E" letter-spacing="2">FIG 01 · MULTILINGUAL STATIC PUBLISHING ARCHITECTURE</text>
  <rect x="96" y="220" width="288" height="160" rx="8" fill="#FFFFFF" stroke="#315F4E" stroke-width="2"/>
  <text x="124" y="268" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1B201D">1. Content Layer</text>
  <text x="124" y="306" font-family="monospace" font-size="15" fill="#5D6860">src/content/blog/{lang}/</text>
  <text x="124" y="338" font-family="system-ui, sans-serif" font-size="15" fill="#5D6860">Zod Schema + Cross-File</text>
  <text x="124" y="360" font-family="system-ui, sans-serif" font-size="15" fill="#5D6860">Invariant Verification</text>

  <rect x="496" y="220" width="288" height="160" rx="8" fill="#FFFFFF" stroke="#315F4E" stroke-width="2"/>
  <text x="524" y="268" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1B201D">2. Reciprocal SEO</text>
  <text x="524" y="306" font-family="monospace" font-size="15" fill="#315F4E">translationKey Registry</text>
  <text x="524" y="338" font-family="system-ui, sans-serif" font-size="15" fill="#5D6860">Self-canonical + Symmetric</text>
  <text x="524" y="360" font-family="system-ui, sans-serif" font-size="15" fill="#5D6860">hreflang Matrix (9 Locales)</text>

  <rect x="896" y="220" width="288" height="160" rx="8" fill="#FFFFFF" stroke="#315F4E" stroke-width="2"/>
  <text x="924" y="268" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1B201D">3. Static Output</text>
  <text x="924" y="306" font-family="monospace" font-size="15" fill="#5D6860">dist/ + Pagefind Index</text>
  <text x="924" y="338" font-family="system-ui, sans-serif" font-size="15" fill="#5D6860">Zero-JS Article Prose +</text>
  <text x="924" y="360" font-family="system-ui, sans-serif" font-size="15" fill="#5D6860">Sticky H2/H3 Outline</text>

